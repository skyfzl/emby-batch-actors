name: Build plugin DLL

on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - '.github/workflows/build-plugin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build plugin/Emby.BatchActors.csproj -c Release
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: Emby.BatchActors
          path: plugin/bin/Release/netstandard2.0/Emby.BatchActors.dll
          if-no-files-found: error
